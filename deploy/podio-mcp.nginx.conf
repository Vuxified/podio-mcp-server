# HTTP-only template — Certbot --nginx will add SSL config automatically
server {
    listen 80;
    server_name YOUR_DOMAIN;

    location /mcp {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE / streaming: disable buffering (CRITICAL for MCP Streamable HTTP)
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;

        # Pass-through for SSE
        add_header         X-Accel-Buffering no;
    }

    # ── Future MCP servers ──
    # To add another MCP server, uncomment and adjust:
    # location /other-mcp {
    #     proxy_pass         http://127.0.0.1:3001;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host $host;
    #     proxy_set_header   X-Real-IP $remote_addr;
    #     proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    #     proxy_buffering    off;
    #     proxy_cache        off;
    #     proxy_read_timeout 3600s;
    #     add_header         X-Accel-Buffering no;
    # }
}
